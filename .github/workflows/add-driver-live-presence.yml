name: Driver live presence

on:
  push:
    branches:
      - main
    paths:
      - tools/patch-driver-live-presence.py
      - .github/workflows/add-driver-live-presence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pages
        run: python tools/patch-driver-live-presence.py
      - name: Commit pages
        run: |
          if git diff --quiet -- gestion.html index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestion.html index.html
          git commit -m "Ajouter disponibilité et secteur instantanés DRIVER"
          git push
