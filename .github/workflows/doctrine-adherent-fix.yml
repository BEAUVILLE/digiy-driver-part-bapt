name: Doctrine adhérent DIGIY DRIVER

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doctrine-adherent-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neutraliser les mentions de sélection et certification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('Baptiste — Chauffeur ambassadeur DIGIY DRIVER', 'Baptiste — Chauffeur · Adhérent DIGIYLYFE'),
            ('Baptiste, chauffeur ambassadeur DIGIY DRIVER', 'Baptiste, chauffeur · adhérent DIGIYLYFE'),
            ('"jobTitle": "Chauffeur ambassadeur DIGIY DRIVER"', '"jobTitle": "Chauffeur"'),
            ('Ambassadeur • contact direct • 0% commission', 'Adhérent DIGIYLYFE • contact direct • 0% commission'),
            ('🚗 Baptiste · Ambassadeur DIGIY DRIVER', '🚗 Baptiste · Adhérent DIGIYLYFE'),
            ('Baptiste est un chauffeur ambassadeur DIGIY DRIVER.', 'Baptiste est chauffeur et adhérent DIGIYLYFE.'),
            ('>👑 Ambassadeur<', '>👤 ADHÉRENT DIGIYLYFE<'),
            ('Chauffeur%20ambassadeur%20DIGIY%20DRIVER', 'Chauffeur%20%C2%B7%20Adh%C3%A9rent%20DIGIYLYFE'),
            ('Baptiste est un chauffeur ambassadeur.', 'Baptiste est chauffeur et adhérent DIGIYLYFE.'),
            ('Baptiste mooy chauffeur ambassadeur.', 'Baptiste mooy chauffeur, adhérent DIGIYLYFE.'),
            ("const title = 'Baptiste — Chauffeur ambassadeur DIGIY DRIVER';", "const title = 'Baptiste — Chauffeur · Adhérent DIGIYLYFE';"),
            ('QR officiel DIGIYLYFE', 'QR DIGIYLYFE'),
            ('>🧾 QR officiel<', '>🧾 QR DIGIYLYFE<'),
            ('9:16 · QR vérifiable', '9:16 · QR scannable'),
            ('Baptiste is an ambassador driver.', 'Baptiste is a driver and a DIGIYLYFE member.'),
            ('official DIGIYLYFE QR', 'DIGIYLYFE QR'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Retirer le workflow temporaire et pousser
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/doctrine-adherent-fix.yml
          git add index.html
          git commit -m 'Neutraliser DRIVER : adhérent DIGIYLYFE' || exit 0
          git push
