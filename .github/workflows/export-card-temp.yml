name: Corriger carte PNG Baptiste

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-card-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Pillow
        run: python3 -m pip install --quiet pillow
      - name: Remplacer AMBASSADEUR par ADHÉRENT DIGIYLYFE sur le PNG
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          path = 'carte-visite-baptiste.png'
          img = Image.open(path).convert('RGB')
          draw = ImageDraw.Draw(img)

          navy = (7, 24, 34)
          gold = (255, 205, 91)
          x0, y0, x1, y1 = 92, 438, 952, 535
          draw.rounded_rectangle((x0, y0, x1, y1), radius=20, fill=navy, outline=gold, width=2)

          text = 'CHAUFFEUR · ADHÉRENT DIGIYLYFE'
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          size = 42
          while size > 28:
              font = ImageFont.truetype(font_path, size)
              bbox = draw.textbbox((0, 0), text, font=font)
              if bbox[2] - bbox[0] <= (x1 - x0 - 40):
                  break
              size -= 1

          tw = bbox[2] - bbox[0]
          th = bbox[3] - bbox[1]
          tx = x0 + (x1 - x0 - tw) / 2
          ty = y0 + (y1 - y0 - th) / 2 - 3
          draw.text((tx, ty), text, font=font, fill=gold)
          img.save(path, optimize=True)
          PY
      - name: Commit PNG uniquement
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add carte-visite-baptiste.png
          git commit -m 'Carte Baptiste : chauffeur adhérent DIGIYLYFE'
          git push
