name: Export carte Baptiste temporaire

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-card-temp.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: carte-baptiste-current
          path: carte-visite-baptiste.png
          retention-days: 1
