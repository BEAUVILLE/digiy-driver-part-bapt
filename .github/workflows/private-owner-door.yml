name: Séparer porte privée DRIVER
on:
  push:
    branches: [main]
    paths: ['.github/workflows/private-owner-door.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retirer porte publique et fixer retour gestion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<a href="./gestion.html">🔐 ACCÈS ADHÉRENT</a>'
          if old not in s: raise SystemExit('porte adhérent DRIVER introuvable')
          p.write_text(s.replace(old,''))
          g=Path('gestion.html')
          t=g.read_text()
          old2='<a class="back" href="./?lang=fr">← Ma fiche DRIVER</a>'
          new2='<a class="back" href="https://digiy-driver-part-bapt.digiylyfe.com/?lang=fr">← Ma fiche DRIVER</a>'
          if old2 not in t: raise SystemExit('retour gestion DRIVER introuvable')
          g.write_text(t.replace(old2,new2))
          PY
      - name: Vérifier
        run: |
          ! grep -q 'ACCÈS ADHÉRENT' index.html
          grep -q 'https://digiy-driver-part-bapt.digiylyfe.com/?lang=fr' gestion.html
      - name: Commit
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add index.html gestion.html
          git commit -m 'Privatiser accès adhérent DRIVER'
          git push
